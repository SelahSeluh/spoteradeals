<!doctype html><html><head><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpoteraDeals layout checks</title><style>body{font:14px system-ui;background:#dedede;margin:0;padding:12px}button{padding:10px;margin:5px}iframe{display:block;border:0;background:#faf6ec;height:850px;max-width:none;margin:auto}#state{font-size:12px}header{position:sticky;top:0;background:#fff;z-index:2}</style></head><body><header><strong>Layout check</strong><button data-width="375">Phone 375</button><button data-width="390">Phone 390</button><button data-width="768">Tablet 768</button><button data-width="1280">Desktop 1280</button><button id="fresh">Fresh startup</button><span id="state"></span></header><iframe title="SpoteraDeals responsive preview" src="/#auth" style="width:375px"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.querySelector('#state').textContent='Width '+b.dataset.width});document.querySelector('#fresh').onclick=()=>{sessionStorage.removeItem('spotera_animated');sessionStorage.removeItem('paper_guest_entered');frame.src='/?startup='+Date.now()};</script></body></html>
