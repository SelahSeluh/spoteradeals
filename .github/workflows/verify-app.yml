name: Verify SpoteraDeals app
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-check-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile production serverless API
        run: npx esbuild api/status.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/spotera-api-check.mjs
      - name: Check TypeScript
        run: npm run lint
      - name: Build website
        run: npm run build:web
